name: Bug report
description: Report a problem with strapi-plugin-sitetune
labels: [bug]
body:
  - type: input
    id: strapi-version
    attributes:
      label: Strapi version
      placeholder: '5.x.x'
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: '22.x'
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
        - MySQL / MariaDB
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output, browser console, etc. Will be formatted as code.
      render: shell
