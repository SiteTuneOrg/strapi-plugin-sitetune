name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:ts:back
      - run: yarn test:ts:front

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      # --ignore-engines: dev-only transitive tools require Node >=22;
      # the plugin itself supports >=20 and vitest exercises it on both.
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn verify
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Pack plugin tarball
        run: |
          npm pack
          mv strapi-plugin-sitetune-*.tgz /tmp/plugin.tgz
      - name: Create Strapi 5 app
        working-directory: /tmp
        run: >
          npx create-strapi@latest smoke-app --ts --no-run --no-example
          --no-git-init --skip-cloud --dbclient=sqlite --install --use-npm
      - name: Install plugin from tarball
        working-directory: /tmp/smoke-app
        run: npm install /tmp/plugin.tgz
      - name: Enable plugin
        working-directory: /tmp/smoke-app
        run: |
          cat > config/plugins.ts <<'EOF'
          export default {
            sitetune: { enabled: true },
          };
          EOF
      - name: Build app (admin bundle must compile with the plugin)
        working-directory: /tmp/smoke-app
        run: npm run build
      - name: Boot server (server entry must load)
        working-directory: /tmp/smoke-app
        env:
          # create-strapi writes DATABASE_FILENAME= (empty) to .env, which
          # defeats the config default and makes sqlite try to open a directory.
          DATABASE_FILENAME: .tmp/data.db
        run: |
          mkdir -p .tmp
          npm run start &
          SERVER_PID=$!
          if ! timeout 90 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:1337/_health; do sleep 2; done'; then
            echo "Server failed to become healthy within 90s"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Server is healthy"
          test -f src/components/sitetune/seo.json
          test -f src/components/sitetune/open-graph.json
          echo "SiteTune components were created on the host"
          kill "$SERVER_PID" 2>/dev/null || true
